      <circle cx="10" cy="28" r="2.2" />
      <circle cx="46" cy="28" r="2.2" />
      <circle cx="28" cy="12" r="2.2" />
      <circle cx="28" cy="44" r="2.2" />
      <circle cx="16" cy="17" r="1.8" />
      <circle cx="40" cy="17" r="1.8" />
      <circle cx="16" cy="39" r="1.8" />
      <circle cx="40" cy="39" r="1.8" />
