name: Scheduled UI, Links & Capabilities Test Audit

on:
  # Scheduled execution: Runs every night at 02:00 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Continuous Integration: Trigger on push and pull requests
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  # Manual on-demand execution
  workflow_dispatch:

jobs:
  ui-audit:
    name: Run Complete UI, Links & Features Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run UI, Links & Capabilities Tests
        run: npm run test:ui
        env:
          PORT: 4000
          CI: true

      - name: Upload Test Results & Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/playwright-report/
          retention-days: 14
