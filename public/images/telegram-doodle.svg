      <circle cx="20" cy="20" r="7" />
      <!-- Thread lines -->
      <line x1="20" y1="35" x2="20" y2="58" />
      <line x1="13" y1="40" x2="27" y2="44" />
      <line x1="13" y1="46" x2="27" y2="50" />
      <line x1="13" y1="52" x2="27" y2="56" />
    </g>

    <!-- 7. Compass / Divider / پرگار (Center-Left) -->
    <g transform="translate(20, 160) rotate(-35) scale(0.8)">
      <circle cx="20" cy="8" r="4" />
      <line x1="20" y1="12" x2="6" y2="48" />
      <line x1="20" y1="12" x2="34" y2="48" />
