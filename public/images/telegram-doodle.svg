      <polygon points="0,0 12,0 8,14 4,14" />
      <polygon points="16,0 28,0 24,14 20,14" />
      <polygon points="32,0 44,0 40,14 36,14" />
      <polygon points="48,0 60,0 56,14 52,14" />
