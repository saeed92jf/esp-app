<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!-- Soft Telegram doodle icons tile -->
  <g stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Panda head (top-right / middle) -->
    <g transform="translate(190, 195) scale(0.9)">
      <!-- Head -->
      <ellipse cx="25" cy="25" rx="20" ry="18" />
      <!-- Ears -->
      <circle cx="9" cy="11" r="5" fill="rgba(255, 255, 255, 0.12)" />
      <circle cx="41" cy="11" r="5" fill="rgba(255, 255, 255, 0.12)" />
      <!-- Eye patches -->
      <ellipse cx="17" cy="23" rx="4" ry="5" transform="rotate(-15 17 23)" fill="rgba(255, 255, 255, 0.15)" />
      <ellipse cx="33" cy="23" rx="4" ry="5" transform="rotate(15 33 23)" fill="rgba(255, 255, 255, 0.15)" />
      <!-- Nose & Mouth -->
      <ellipse cx="25" cy="30" rx="2.5" ry="1.5" />
      <path d="M22 34 Q25 36 28 34" />
    </g>

    <!-- Hot Air Balloon (bottom-right) -->
    <g transform="translate(245, 260) scale(0.85)">
      <path d="M25 5 C10 5 2 20 8 36 C12 45 20 52 22 55 L28 55 C30 52 38 45 42 36 C48 20 40 5 25 5 Z" />
      <path d="M25 5 Q17 28 22 55" />
      <path d="M25 5 Q33 28 28 55" />
      <line x1="21" y1="58" x2="21" y2="63" />
      <line x1="29" y1="58" x2="29" y2="63" />
      <rect x="19" y="63" width="12" height="8" rx="1.5" />
      <!-- Mini cloud next to balloon -->
      <path d="M48 45 C48 41 53 40 56 42 C59 39 65 41 65 45 C68 45 70 48 68 51 C66 53 50 53 48 51 Z" />
    </g>

    <!-- Strawberry (middle-left) -->
    <g transform="translate(45, 220) scale(0.95)">
      <path d="M22 8 C10 8 5 22 14 36 C18 42 22 46 22 46 C22 46 26 42 30 36 C39 22 34 8 22 8 Z" />
      <!-- Strawberry leaves -->
      <path d="M22 8 C20 4 15 2 13 4 C15 7 18 8 22 8 Z" fill="rgba(255, 255, 255, 0.15)" />
      <path d="M22 8 C24 4 29 2 31 4 C29 7 26 8 22 8 Z" fill="rgba(255, 255, 255, 0.15)" />
      <path d="M22 8 L22 3" />
      <!-- Seeds -->
      <circle cx="16" cy="18" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="28" cy="18" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="22" cy="24" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="17" cy="30" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="27" cy="30" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="22" cy="37" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
    </g>

    <!-- Watermelon slice (top-right) -->
    <g transform="translate(265, 80) scale(0.9)">
      <path d="M5 25 A25 25 0 0 0 45 25 Z" />
      <path d="M8 24 A21 21 0 0 0 42 24" />
      <circle cx="18" cy="18" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="25" cy="21" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
      <circle cx="32" cy="18" r="0.8" fill="rgba(255, 255, 255, 0.4)" />
    </g>

    <!-- Hot Coffee / Tea Mug (top-left) -->
    <g transform="translate(35, 45) scale(0.9)">
      <rect x="10" y="16" width="26" height="22" rx="4" />
      <path d="M36 21 C42 21 42 31 36 31" />
      <!-- Steam lines -->
      <path d="M16 11 Q19 7 16 3" />
      <path d="M23 11 Q26 7 23 3" />
      <path d="M30 11 Q33 7 30 3" />
    </g>

    <!-- Paper Airplane (center-top) -->
    <g transform="translate(155, 35) scale(0.85)">
      <path d="M2 24 L36 4 L22 36 L16 25 Z" />
      <path d="M16 25 L36 4" />
      <path d="M16 25 L16 32 L20 28" />
    </g>

    <!-- Envelope with heart (middle) -->
    <g transform="translate(135, 140) scale(0.9)">
      <rect x="5" y="10" width="34" height="24" rx="3" />
      <path d="M5 10 L22 24 L39 10" />
      <!-- Heart -->
      <path d="M22 28 C20 25 16 26 16 29 C16 33 22 36 22 36 C22 36 28 33 28 29 C28 26 24 25 22 28 Z" fill="rgba(255, 255, 255, 0.2)" />
    </g>

    <!-- Bird / Duck (center-left) -->
    <g transform="translate(95, 280) scale(0.8)">
      <path d="M35 15 C30 10 20 12 18 18 C14 18 10 20 8 24 C5 30 8 38 18 38 C28 38 36 32 36 22 Z" />
      <circle cx="28" cy="16" r="1.5" fill="rgba(255, 255, 255, 0.4)" />
      <path d="M35 17 L42 19 L36 22" />
      <!-- Wing -->
      <path d="M16 24 Q24 22 22 30" />
    </g>

    <!-- Umbrella (bottom-middle) -->
    <g transform="translate(180, 290) scale(0.85)">
      <path d="M5 25 C5 12 35 12 35 25 Z" />
      <line x1="20" y1="7" x2="20" y2="35" />
      <path d="M20 35 C20 38 16 38 16 35" />
    </g>

    <!-- Chat speech bubble (left-middle) -->
    <g transform="translate(15, 140) scale(0.85)">
      <rect x="6" y="8" width="28" height="20" rx="5" />
      <path d="M12 28 L8 34 L18 28" />
      <line x1="12" y1="15" x2="28" y2="15" stroke-dasharray="2 2" />
      <line x1="12" y1="20" x2="22" y2="20" stroke-dasharray="2 2" />
    </g>

    <!-- Pencil (top-right-ish) -->
    <g transform="translate(260, 155) rotate(45) scale(0.8)">
      <rect x="0" y="0" width="8" height="28" rx="1" />
      <path d="M0 0 L4 -7 L8 0 Z" />
      <line x1="0" y1="22" x2="8" y2="22" />
    </g>

    <!-- Apple with leaf (top) -->
    <g transform="translate(95, 85) scale(0.8)">
      <path d="M15 10 C10 7 5 12 7 18 C9 24 15 26 15 26 C15 26 21 24 23 18 C25 12 20 7 15 10 Z" />
      <path d="M15 10 Q16 5 18 3" />
      <path d="M18 4 Q23 3 22 7 Q18 7 18 4" fill="rgba(255, 255, 255, 0.2)" />
    </g>

    <!-- Cherries on stem (bottom-left) -->
    <g transform="translate(25, 305) scale(0.85)">
      <circle cx="10" cy="22" r="6" />
      <circle cx="26" cy="24" r="6" />
      <path d="M10 16 Q18 5 22 2" />
      <path d="M26 18 Q20 8 22 2" />
      <path d="M22 2 Q27 0 29 4" />
    </g>

    <!-- Star / Sparkles -->
    <g transform="translate(70, 185) scale(0.7)">
      <path d="M15 0 L18 10 L28 10 L20 16 L23 26 L15 20 L7 26 L10 16 L2 10 L12 10 Z" fill="rgba(255, 255, 255, 0.15)" />
    </g>
    <g transform="translate(320, 220) scale(0.6)">
      <path d="M15 0 L18 10 L28 10 L20 16 L23 26 L15 20 L7 26 L10 16 L2 10 L12 10 Z" fill="rgba(255, 255, 255, 0.15)" />
    </g>
    <g transform="translate(200, 110) scale(0.5)">
      <path d="M15 0 L18 10 L28 10 L20 16 L23 26 L15 20 L7 26 L10 16 L2 10 L12 10 Z" fill="rgba(255, 255, 255, 0.15)" />
    </g>

    <!-- Music note -->
    <g transform="translate(325, 60) scale(0.8)">
      <circle cx="8" cy="22" r="4" fill="rgba(255, 255, 255, 0.2)" />
      <line x1="12" y1="22" x2="12" y2="6" />
      <path d="M12 6 C16 6 18 10 20 12" />
    </g>

    <!-- Small flower -->
    <g transform="translate(315, 315) scale(0.7)">
      <circle cx="15" cy="15" r="3" fill="rgba(255, 255, 255, 0.2)" />
      <circle cx="15" cy="8" r="3" />
      <circle cx="22" cy="15" r="3" />
      <circle cx="15" cy="22" r="3" />
      <circle cx="8" cy="15" r="3" />
    </g>

  </g>
</svg>
