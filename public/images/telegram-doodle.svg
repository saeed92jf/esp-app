      <line x1="8" y1="10" x2="8" y2="15" />
      <line x1="16" y1="10" x2="16" y2="18" />
      <line x1="24" y1="10" x2="24" y2="15" />
      <line x1="32" y1="10" x2="32" y2="18" />
      <line x1="40" y1="10" x2="40" y2="15" />
      <line x1="48" y1="10" x2="48" y2="18" />
      <line x1="56" y1="10" x2="56" y2="15" />
