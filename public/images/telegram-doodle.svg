<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" fill="none">
  <!-- Dense, Scattered Engineering Doodles for Telegram Green Chat Background -->
  <g stroke="rgba(0, 0, 0, 0.14)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Interlocking Gears (Top-Left) -->
    <g transform="translate(35, 30) rotate(-12) scale(0.85)">
      <circle cx="28" cy="28" r="16" />
      <circle cx="28" cy="28" r="7" fill="rgba(0, 0, 0, 0.03)" />
      <!-- Gear 1 teeth -->
      <path d="M25 8 L31 8 L32 12 L24 12 Z M25 44 L31 44 L30 48 L26 48 Z M8 25 L8 31 L12 32 L12 24 Z M44 25 L44 31 L48 30 L48 26 Z" />
      <path d="M14 14 L18 10 L22 13 L17 17 Z M38 38 L42 34 L45 37 L41 41 Z M14 42 L10 38 L13 34 L17 38 Z M38 18 L34 14 L37 11 L41 15 Z" />
      <!-- Meshed smaller gear -->
      <g transform="translate(42, 34) scale(0.65)">
        <circle cx="20" cy="20" r="14" />
        <circle cx="20" cy="20" r="5" />
        <path d="M18 4 L22 4 L22 8 L18 8 Z M18 32 L22 32 L22 36 L18 36 Z M4 18 L4 22 L8 22 L8 18 Z M32 18 L32 22 L36 22 L36 18 Z" />
      </g>
    </g>

    <!-- 2. Vernier Caliper / کولیس (Top-Center) -->
    <g transform="translate(165, 25) rotate(18) scale(0.75)">
      <!-- Main bar -->
      <rect x="0" y="8" width="85" height="10" rx="1" />
      <!-- Fixed jaw -->
      <path d="M0 8 L0 -14 C-4 -14 -8 -10 -8 -4 L-8 8 Z" />
      <path d="M0 18 L0 26 C-4 26 -6 24 -6 20 L-6 18 Z" />
      <!-- Sliding jaw -->
      <rect x="28" y="4" width="16" height="18" rx="2" fill="rgba(0, 0, 0, 0.03)" />
      <path d="M28 4 L28 -12 C25 -12 22 -8 22 -4 L22 4 Z" />
      <path d="M28 22 L28 28 C26 28 24 26 24 22 Z" />
      <!-- Scale markings -->
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="18" y1="8" x2="18" y2="14" />
      <line x1="24" y1="8" x2="24" y2="12" />
      <line x1="48" y1="8" x2="48" y2="12" />
      <line x1="54" y1="8" x2="54" y2="14" />
      <line x1="60" y1="8" x2="60" y2="12" />
      <line x1="66" y1="8" x2="66" y2="14" />
    </g>

    <!-- 3. Drafting Triangle / گونیا (Top-Right) -->
    <g transform="translate(380, 20) rotate(-25) scale(0.8)">
      <polygon points="5,50 65,50 5,5" />
      <polygon points="15,44 48,44 15,18" fill="rgba(0, 0, 0, 0.03)" />
      <!-- Scale ticks on hypotenuse -->
      <line x1="18" y1="47" x2="18" y2="50" />
      <line x1="26" y1="47" x2="26" y2="50" />
      <line x1="34" y1="47" x2="34" y2="50" />
      <line x1="42" y1="47" x2="42" y2="50" />
    </g>

    <!-- 4. Industrial Flange with Bolt Holes / فلنج (Top-Left-ish) -->
    <g transform="translate(100, 95) rotate(15) scale(0.75)">
      <ellipse cx="28" cy="28" rx="26" ry="20" />
      <ellipse cx="28" cy="28" rx="14" ry="10" />
